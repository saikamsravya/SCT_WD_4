<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<title>Advanced To-Do App</title>
<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial;
}
/* BODY */
body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    padding:20px;
}
/* CONTAINER */
.container{
    width:550px;
    max-width:95%;
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(15px);
    padding:35px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
    color:white;
}
/* TITLE */
.container h1{
    text-align:center;
    margin-bottom:25px;
    font-size:42px;
    color:#38bdf8;
}
/* INPUT SECTION */
.input-section{
    display:flex;
    flex-direction:column;
    gap:15px;
}
/* INPUTS */
.input-section input{
    padding:15px;
    border:none;
    border-radius:12px;
    outline:none;
    background:#1e293b;
    color:white;
    font-size:16px;
}
/* PLACEHOLDER */
.input-section input::placeholder{
    color:#cbd5e1;
}
/* ADD BUTTON */
.add-btn{
    padding:15px;
    border:none;
    border-radius:12px;
    background:#38bdf8;
    color:white;
    font-size:18px;
    cursor:pointer;
    transition:0.3s;
}
.add-btn:hover{
    background:#0284c7;
    transform:scale(1.03);
}
/* TASK LIST */
#taskList{
    margin-top:25px;
}
/* TASK CARD */
.task{
    background:#1e293b;
    padding:20px;
    border-radius:18px;
    margin-top:18px;
    animation:fadeIn 0.4s ease;
    box-shadow:0 5px 15px rgba(0,0,0,0.3);
}
/* ANIMATION */
@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
/* TASK TITLE */
.task h3{
    font-size:24px;
    margin-bottom:10px;
}
/* TASK DETAILS */
.task p{
    color:#cbd5e1;
    margin-bottom:15px;
    font-size:16px;
}
/* BUTTON SECTION */
.task-buttons{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}
/* BUTTONS */
.task-buttons button{
    padding:10px 16px;
    border:none;
    border-radius:10px;
    color:white;
    cursor:pointer;
    transition:0.3s;
    font-size:15px;
}
/* COMPLETE BUTTON */
.complete-btn{
    background:#22c55e;
}
.complete-btn:hover{
    background:#16a34a;
    transform:scale(1.05);
}
/* EDIT BUTTON */
.edit-btn{
    background:#f59e0b;
}
.edit-btn:hover{
    background:#d97706;
    transform:scale(1.05);
}
/* DELETE BUTTON */
.delete-btn{
    background:#ef4444;
}
.delete-btn:hover{
    background:#dc2626;
    transform:scale(1.05);
}
/* COMPLETED TASK */
.completed h3{
    text-decoration:line-through;
    color:#94a3b8;
}
.completed p{
    text-decoration:line-through;
}
/* EMPTY MESSAGE */
.empty{
    text-align:center;
    margin-top:20px;
    color:#cbd5e1;
    font-size:18px;
}
</style>
</head>
<body>
<div class="container">
<h1> To-Do App!</h1>
<!-- INPUT SECTION -->
<div class="input-section">
<input type="text"
id="taskInput"
placeholder="Enter your task">
<input type="date"
id="taskDate">
<input type="time"
id="taskTime">
<button class="add-btn"
onclick="addTask()">
 Add Task
</button>
</div>
<!-- TASK LIST -->
<div id="taskList">
<p class="empty"
id="emptyMessage">
No tasks added yet
</p>
</div>
</div>
<script>
/* ADD TASK */
function addTask(){
let taskInput =
document.getElementById("taskInput");
let taskDate =
document.getElementById("taskDate");
let taskTime =
document.getElementById("taskTime");
let taskText =
taskInput.value;
/* VALIDATION */
if(taskText == ""){
alert("Please enter a task");
return;
}
/* HIDE EMPTY MESSAGE */
document.getElementById("emptyMessage")
.style.display = "none";
/* CREATE TASK */
let task =
document.createElement("div");
task.classList.add("task");
/* DATE & TIME */
let date =
taskDate.value || "No Date";
let time =
taskTime.value || "No Time";
/* TASK CONTENT */
task.innerHTML =
"<h3> " + taskText + "</h3>" +
"<p>" + date +
" |  " + time + "</p>" +
"<div class='task-buttons'>" +
"<button class='complete-btn' onclick='completeTask(this)'>✔ Complete</button>" +
"<button class='edit-btn' onclick='editTask(this)'>✏ Edit</button>" +
"<button class='delete-btn' onclick='deleteTask(this)'>🗑 Delete</button>" +
"</div>";
/* ADD TASK */
document.getElementById("taskList")
.appendChild(task);
/* CLEAR INPUTS */
taskInput.value = "";
taskDate.value = "";
taskTime.value = "";
}
/* COMPLETE TASK */
function completeTask(button){
let task =
button.parentElement.parentElement;
task.classList.toggle("completed");
}
/* DELETE TASK */
function deleteTask(button){
let task =
button.parentElement.parentElement;
task.remove();
/* SHOW EMPTY MESSAGE */
let allTasks =
document.querySelectorAll(".task");
if(allTasks.length == 0){
document.getElementById("emptyMessage")
.style.display = "block";
}
}
/* EDIT TASK */
function editTask(button){
let task =
button.parentElement.parentElement;
let title =
task.querySelector("h3");
let newTask =
prompt("Edit Task", title.innerHTML);
if(newTask != null &&
newTask != ""){
title.innerHTML = newTask;
}
}
</script>
</body>
</html>
